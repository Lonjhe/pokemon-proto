/* tirage */
const POOL=[[25,'Pikachu'],[6,'Dracaufeu'],[9,'Tortank'],[3,'Florizarre'],[94,'Ectoplasma'],[130,'Léviator'],[149,'Dracolosse'],[133,'Évoli'],[143,'Ronflex'],[150,'Mewtwo'],[59,'Arcanin'],[65,'Alakazam'],[131,'Lokhlass'],[39,'Rondoudou'],[4,'Salamèche']];

let N=1,rmode=-1,pulls=[],kinds=[],t0=0,paused=true,tcur=0,done=false;const END=12.9;

function newPull(){pulls=[];const cnt=N===1?1:10;
 for(let i=0;i<cnt;i++){const p=POOL[Math.floor(Math.random()*POOL.length)],r=Math.random();let tier=r<.6?0:r<.85?1:r<.97?2:3;if(rmode>=0)tier=Math.min(tier,rmode);pulls.push({id:p[0],n:p[1],tier})}

 pulls.forEach(p=>p.rare=p.tier>=2);

 for(let i=kinds.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[kinds[i],kinds[j]]=[kinds[j],kinds[i]]}}
const maxTier=()=>Math.max(...pulls.map(p=>p.tier));
/* Poké Balls dessinées : 4 modèles selon la rareté */
const BT=[{top:['#ff5348','#a81d1d'],aura:'255,170,100'},{top:['#4f90f2','#1c3f9a'],aura:'110,170,255'},{top:['#454545','#101010'],aura:'255,215,90'},{top:['#b878f5','#5a1f9a'],aura:'rainbow'}];
function aura(x,y,r,tier,t){const c=tier===3?`${Math.round(150+105*Math.sin(t*3))},${Math.round(150+105*Math.sin(t*3+2))},${Math.round(150+105*Math.sin(t*3+4))}`:BT[tier].aura;add(()=>{glow(x,y,r*(2+tier*.7),`rgba(${c},A)`,.35+tier*.12)})}
const BI=[0,1,2,3].map(i=>{const im=new Image();im.src='img/gball_'+i+'.png';return im});
function ball(x,y,r,tier,roll,yaw,openK){
 const im=BI[tier];if(!im.complete||!im.naturalWidth)return ballOld(x,y,r,tier,roll,yaw,openK);
 const d=r*2.1,sq=1-.1*Math.abs(Math.sin(yaw*.5)),S=256,cut=S*.56;
 ctx.save();ctx.translate(x,y);ctx.rotate(roll);ctx.scale(sq,1);
 if(openK>0){
  ctx.save();ctx.translate(0,-r*.95*openK);ctx.rotate(-.5*openK);ctx.drawImage(im,0,0,S,cut,-d/2,-d/2,d,d*cut/S);ctx.restore();
  ctx.save();ctx.translate(0,r*.4*openK);ctx.rotate(.15*openK);ctx.drawImage(im,0,cut,S,S-cut,-d/2,-d/2+d*cut/S,d,d*(S-cut)/S);ctx.restore();

function ballOld(x,y,r,tier,roll,yaw,openK){
 const m=BT[tier];ctx.save();ctx.translate(x,y);ctx.rotate(roll);
 const half=top=>{ctx.save();ctx.beginPath();ctx.arc(0,0,r,top?Math.PI:0,top?2*Math.PI:Math.PI);ctx.closePath();const g=ctx.createLinearGradient(0,top?-r:0,0,top?0:r);if(top){g.addColorStop(0,m.top[0]);g.addColorStop(1,m.top[1])}else{g.addColorStop(0,'#fff');g.addColorStop(1,'#b9c3ea')}ctx.fillStyle=g;ctx.fill();
  if(top){ctx.clip();if(tier===1){ctx.fillStyle='#e03030';[-1,1].forEach(d=>{ctx.beginPath();ctx.ellipse(d*r*.62,-r*.28,r*.2,r*.32,d*.5,0,7);ctx.fill()})}
   if(tier===2){ctx.fillStyle='#ffd23a';[-1,1].forEach(d=>{ctx.beginPath();ctx.moveTo(d*r*.2,-r);ctx.lineTo(d*r*.52,-r);ctx.lineTo(d*r*.75,-r*.12);ctx.lineTo(d*r*.4,-r*.12);ctx.fill()})}
   if(tier===3){ctx.fillStyle='#ff7ab8';[-1,1].forEach(d=>{ctx.beginPath();ctx.arc(d*r*.55,-r*.42,r*.26,0,7);ctx.fill()});ctx.fillStyle='#fff7';ctx.beginPath();ctx.ellipse(0,-r*.62,r*.5,r*.1,0,0,7);ctx.fill()}}
  ctx.restore();ctx.lineWidth=Math.max(1,r*.09);ctx.strokeStyle='#14142a';ctx.beginPath();ctx.arc(0,0,r,top?Math.PI:0,top?2*Math.PI:Math.PI);ctx.closePath();ctx.stroke()};
 if(openK>0){ctx.save();ctx.translate(0,-r*.95*openK);ctx.rotate(-.5*openK);half(true);ctx.restore();ctx.save();ctx.translate(0,r*.4*openK);ctx.rotate(.15*openK);half(false);ctx.restore()}

}
const LAB=[[0,'Invocation'],[1.5,'Le cercle s\'allume'],[3,'Le portail s\'ouvre'],[5.5,'Les Poké Balls jaillissent'],[5.8,'Elles tournent sur la plateforme'],[6.4,'Fusion en une ball'],[7.1,'La ball descend dans la lumière'],[8.2,'La ball s\'ouvre'],[8.6,'Révélation des Pokémon'],[10.6,'Flash final']];
function frame(t){
 ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);if(pick(0)){ctx.fillStyle='#05071a';ctx.fillRect(0,0,cv.width,cv.height)}
 ctx.setTransform(sx,0,0,sy,ox,oy);
 const zoom=1+.03*sm(t,0,END),dim=0;
 drawVideo(zoom,dim,t);const V=t;t=t<5.5?t:t<7?5.5:t-1.5;
 let sh=0;if(t>2.6&&t<5)sh=0;if(t>9.5&&t<12)sh=2.5*sm(t,9.5,10.3);
 /* lueurs animées par-dessus */
 add(()=>{
  if(t>4.8&&t<8)glow(P.x,P.y,150,'rgba(255,220,150,A)',.15+.1*Math.sin(t*4));
 });
 motes(t,.5,6.5,P.x,P.y,170,'rgba(190,225,255,A)',26);

 if(t>5.5&&t<9.3){
  const nb=kinds.length,arr=[];

   if(u<=0)continue;
   if(t<tl){const e=1-Math.pow(1-u,2.2),tg=orb(ang0+(tl-5.5)*1.0),side=(R(i+11)-.5)*140;x=lerp(Q.x,tg.x,e)+Math.sin(u*Math.PI)*side;y=lerp(Q.y,tg.y,e)-Math.sin(u*Math.PI)*70;r=lerp(6,17,e)}
   else{const a=ang0+(t-5.5)*1.0,o=orb(a);x=o.x;y=o.y+Math.sin(t*3+i)*4;r=15+o.d*5;sp=9}
   if(t>6.5){const k=sm(t,6.5,7.15),a=ang0+(t-5.5)*1.0+(t-6.5)*2,rr=118*(1-k);x=P.x+Math.cos(a)*rr;y=lerp(P.y-70+Math.sin(a)*34*(1-k),P.y-96,k);r=lerp(r,6,k);al=1-sm(t,6.85,7.15)}
   arr.push({x,y,r,al,sp,i,u})
  }
  arr.sort((a,b)=>a.y-b.y).forEach(b=>{const tier=kinds[b.i];
   if(t<7&&b.u>0&&b.u<1){add(()=>{const tc=tier===3?'255,200,255':BT[tier].aura;ctx.lineCap='round';ctx.beginPath();const n=18;for(let s=0;s<n;s++){const uu=Math.max(0,b.u-s*.022),e=1-Math.pow(1-uu,2.2),tl=5.5+b.i*.09+1.1,tg={x:P.x+Math.cos(b.i/kinds.length*6.283+(tl-5.5))*118,y:P.y-70+Math.sin(b.i/kinds.length*6.283+(tl-5.5))*34},side=(R(b.i+11)-.5)*140;const px=lerp(Q.x,tg.x,e)+Math.sin(uu*Math.PI)*side,py=lerp(Q.y,tg.y,e)-Math.sin(uu*Math.PI)*70;s?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.strokeStyle=`rgba(${tc},.18)`;ctx.lineWidth=3.2;ctx.stroke();ctx.strokeStyle=`rgba(255,255,255,.75)`;ctx.lineWidth=.9;ctx.stroke()})}
   ctx.globalAlpha=b.al;aura(b.x,b.y,b.r,tier,t);ball(b.x,b.y,b.r,tier,t*b.sp*.5+b.i,t*b.sp,0);ctx.globalAlpha=1});
  if(t>=7.1&&t<9.3){const mt=maxTier(),k=sm(t,7.1,7.7),o=sm(t,8.1,8.8),rr=lerp(8,54,k)*(1+.08*Math.sin(t*40)*(1-o));
   aura(P.x,P.y-96,rr,mt,t);add(()=>{glow(P.x,P.y-96,120+o*200,'rgba(255,225,150,A)',.15+.45*o);if(o>0){ctx.fillStyle=`rgba(255,255,255,${o*.55})`;ctx.beginPath();ctx.arc(P.x,P.y-96,o*40,0,7);ctx.fill()}});

  rays(P.x,P.y-96,t,ex*(1-.3*sm(t,10.4,11.2)),34,560,t>10?'rgba(255,240,200,A)':'rgba(255,215,160,A)');

}
function showRes(){
 const r=document.getElementById('res');done=true;
 r.innerHTML=`<h2>${N===1?'Tu obtiens':'Résultat du ×10'}</h2><div class="cards ${N===1?'one':'ten'}">${pulls.map(p=>`<div class="cd ${p.rare?'r':''}"><img src="${AR}${p.id}.png" alt="">${p.n}<div class="s">${'★'.repeat(p.tier+1)}</div></div>`).join('')}</div><div class="rb"><a id="again">Rejouer</a><a id="back">Retour</a></div>`;
 r.style.display='flex';document.getElementById('again').onclick=()=>start(N);document.getElementById('back').onclick=idle;
}
function ui(on){const b=document.getElementById('bt');b.style.opacity=on?1:0;b.style.pointerEvents=on?'auto':'none';document.getElementById('hd').style.opacity=on?1:0}
