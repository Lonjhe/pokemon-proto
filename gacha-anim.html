<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=360,H=640,P={x:180,y:452},Q={x:180,y:160},FH=430,FY=335;
let dpr=Math.min(2,devicePixelRatio||1),sx=1,sy=1,ox=0,oy=0;
function fit(){const r=cv.getBoundingClientRect();cv.width=r.width*dpr;cv.height=r.height*dpr;const s=Math.max(r.width/W,r.height/H);sx=sy=s*dpr;ox=(r.width*dpr-W*sx)/2;oy=(r.height*dpr-H*sy)/2}
const R=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),sm=(t,a,b)=>{const u=cl((t-a)/(b-a));return u*u*(3-2*u)},lerp=(a,b,u)=>a+(b-a)*u;
/* images du concept */
const FR={};let loaded=0;

function drawFrame(n,a,zoom,dim){
 const f=FR[n];if(!f||a<=0)return;ctx.save();ctx.globalAlpha=a;
 ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
 /* fond flou plein écran */
 ctx.drawImage(f.bl,-40,-40,W+80,H+80);
 ctx.fillStyle=`rgba(4,6,30,${.25+dim})`;ctx.fillRect(0,0,W,H);
 /* image nette, bords fondus (masque calculé une fois) */
 const fw=FH*1.5*zoom,fh=FH*zoom,fx=W/2-fw/2,fy=FY-fh/2;
 if(!f.mk){const m=document.createElement('canvas');m.width=720;m.height=480;const mg=m.getContext('2d');mg.drawImage(f.im,0,0,720,480);mg.globalCompositeOperation='destination-in';const vg=mg.createLinearGradient(0,0,0,480);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(.2,'rgba(0,0,0,1)');vg.addColorStop(.8,'rgba(0,0,0,1)');vg.addColorStop(1,'rgba(0,0,0,0)');mg.fillStyle=vg;mg.fillRect(0,0,720,480);f.mk=m}
 ctx.drawImage(f.mk,fx,fy,fw,fh);
 ctx.restore()
}
function add(f){ctx.globalCompositeOperation='lighter';f();ctx.globalCompositeOperation='source-over'}
function glow(x,y,r,c,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c.replace('A',a));g.addColorStop(1,c.replace('A',0));ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)}
function star(x,y,r,rot,c){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle=c;ctx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,rr=i%2?r*.26:r;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath();ctx.fill();ctx.restore()}
function rays(cx,cy,t,a,n,len,col){if(a<=0)return;add(()=>{const g=ctx.createRadialGradient(cx,cy,10,cx,cy,len);g.addColorStop(0,col.replace('A',.85));g.addColorStop(.5,col.replace('A',.3));g.addColorStop(1,col.replace('A',0));ctx.fillStyle=g;for(let i=0;i<n;i++){const an=i/n*Math.PI*2+t*.25,w=.04+R(i)*.06,L=len*(.55+R(i+5)*.6);ctx.globalAlpha=a*(.3+R(i+2)*.5);ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(an-w)*L,cy+Math.sin(an-w)*L);ctx.lineTo(cx+Math.cos(an+w)*L,cy+Math.sin(an+w)*L);ctx.fill()}ctx.globalAlpha=1})}
function motes(t,t0,t1,cx,cy,spread,col,n){if(t<t0||t>t1+1.5)return;add(()=>{for(let i=0;i<n;i++){const u=((t-t0)*.35*(.5+R(i+3))+R(i))%1,x=cx+(R(i+7)-.5)*spread+Math.sin(u*6+i)*10,y=cy-u*(cy-60);ctx.fillStyle=col.replace('A',(1-u)*.9*cl((t-t0)*2)*cl((t1+1.5-t)));star(x,y,1.5+R(i+9)*2.5,t*2+i,ctx.fillStyle)}})}

let N=1,rmode=-1,pulls=[],kinds=[],t0=0,paused=true,tcur=0,done=false;const END=13.6;

function newPull(){pulls=[];const cnt=N===1?1:10;

 if(rmode>=0)pulls[Math.floor(Math.random()*cnt)].tier=rmode;
 pulls.forEach(p=>p.rare=p.tier>=2);
 kinds=N===1?[pulls[0].tier,0,0,0,0,0]:pulls.map(p=>p.tier);
 for(let i=kinds.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[kinds[i],kinds[j]]=[kinds[j],kinds[i]]}}

/* Poké Balls dessinées : 4 modèles selon la rareté */
const BT=[{top:['#ff5348','#a81d1d'],aura:'255,170,100'},{top:['#4f90f2','#1c3f9a'],aura:'110,170,255'},{top:['#454545','#101010'],aura:'255,215,90'},{top:['#b878f5','#5a1f9a'],aura:'rainbow'}];
function aura(x,y,r,tier,t){const c=tier===3?`${Math.round(150+105*Math.sin(t*3))},${Math.round(150+105*Math.sin(t*3+2))},${Math.round(150+105*Math.sin(t*3+4))}`:BT[tier].aura;add(()=>{glow(x,y,r*(2+tier*.7),`rgba(${c},A)`,.35+tier*.12)})}
const BI=[0,1,2,3].map(i=>{const im=new Image();im.src='img/gball_'+i+'.png';return im});
function ball(x,y,r,tier,roll,yaw,openK){
 const im=BI[tier];if(!im.complete||!im.naturalWidth)return ballOld(x,y,r,tier,roll,yaw,openK);

  ctx.save();ctx.translate(0,-r*.95*openK);ctx.rotate(-.5*openK);ctx.drawImage(im,0,0,S,cut,-d/2,-d/2,d,d*cut/S);ctx.restore();
  ctx.save();ctx.translate(0,r*.4*openK);ctx.rotate(.15*openK);ctx.drawImage(im,0,cut,S,S-cut,-d/2,-d/2+d*cut/S,d,d*(S-cut)/S);ctx.restore();
 }else ctx.drawImage(im,-d/2,-d/2,d,d);
 ctx.restore()
}
function ballOld(x,y,r,tier,roll,yaw,openK){
 const m=BT[tier];ctx.save();ctx.translate(x,y);ctx.rotate(roll);
 const half=top=>{ctx.save();ctx.beginPath();ctx.arc(0,0,r,top?Math.PI:0,top?2*Math.PI:Math.PI);ctx.closePath();const g=ctx.createLinearGradient(0,top?-r:0,0,top?0:r);if(top){g.addColorStop(0,m.top[0]);g.addColorStop(1,m.top[1])}else{g.addColorStop(0,'#fff');g.addColorStop(1,'#b9c3ea')}ctx.fillStyle=g;ctx.fill();
  if(top){ctx.clip();if(tier===1){ctx.fillStyle='#e03030';[-1,1].forEach(d=>{ctx.beginPath();ctx.ellipse(d*r*.62,-r*.28,r*.2,r*.32,d*.5,0,7);ctx.fill()})}
   if(tier===2){ctx.fillStyle='#ffd23a';[-1,1].forEach(d=>{ctx.beginPath();ctx.moveTo(d*r*.2,-r);ctx.lineTo(d*r*.52,-r);ctx.lineTo(d*r*.75,-r*.12);ctx.lineTo(d*r*.4,-r*.12);ctx.fill()})}
   if(tier===3){ctx.fillStyle='#ff7ab8';[-1,1].forEach(d=>{ctx.beginPath();ctx.arc(d*r*.55,-r*.42,r*.26,0,7);ctx.fill()});ctx.fillStyle='#fff7';ctx.beginPath();ctx.ellipse(0,-r*.62,r*.5,r*.1,0,0,7);ctx.fill()}}
  ctx.restore();ctx.lineWidth=Math.max(1,r*.09);ctx.strokeStyle='#14142a';ctx.beginPath();ctx.arc(0,0,r,top?Math.PI:0,top?2*Math.PI:Math.PI);ctx.closePath();ctx.stroke()};
 if(openK>0){ctx.save();ctx.translate(0,-r*.95*openK);ctx.rotate(-.5*openK);half(true);ctx.restore();ctx.save();ctx.translate(0,r*.4*openK);ctx.rotate(.15*openK);half(false);ctx.restore()}
 else{half(true);half(false);ctx.fillStyle='#14142a';ctx.fillRect(-r,-r*.07,r*2,r*.14);const bx=Math.sin(yaw)*r*.16;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,0,r*.27,0,7);ctx.fill();ctx.lineWidth=r*.09;ctx.strokeStyle='#14142a';ctx.stroke();ctx.fillStyle=tier===3?'#ff9ad0':'#e8ecff';ctx.beginPath();ctx.arc(bx,0,r*.12,0,7);ctx.fill();ctx.fillStyle='#ffffff66';ctx.beginPath();ctx.ellipse(-r*.4,-r*.45,r*.24,r*.13,-.6,0,7);ctx.fill()}
 ctx.restore()
}
/* chronologie : [début, image] */
const SEQ=()=>[[0,2],[2.2,3],[3.4,4],[4.4,5],[5.2,4],[6.5,2],[10.5,14]];
const LAB=[[0,'Plan 1 · Invocation'],[1,'Plan 2 · Le cercle s\'allume'],[2.2,'Plan 3 · Colonne de lumière'],[3.4,'Plan 4 · Portail céleste'],[4.4,'Plan 5 · Le portail éclate'],[5.2,'Plans 6-8 · Les Poké Balls tombent'],[7,'Plans 9-11 · Les balls tournent'],[8.8,'Plan 12 · Fusion en une ball'],[9.5,'Plan 13 · La ball s\'ouvre'],[10.6,'Plans 14-15 · Explosion, silhouettes'],[12.2,'Plan 16 · Flash final']];
function frame(t){
 ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.fillStyle='#05071a';ctx.fillRect(0,0,cv.width,cv.height);
 ctx.setTransform(sx,0,0,sy,ox,oy);
 const seq=SEQ(),X=.8;let k=0;for(let i=0;i<seq.length;i++)if(t>=seq[i][0])k=i;

 const tu=k>0?cl((t-seq[k][0])/X):1,te=tu*tu*tu*(tu*(tu*6-15)+10);

 if(k>0&&tu<1){const b=Math.sin(tu*Math.PI);add(()=>{glow(W/2,FY,330,'rgba(190,215,255,A)',.28*b)})}
 let sh=0;if(t>2.6&&t<5)sh=1.5*sm(t,2.6,3.4);if(t>9.5&&t<12)sh=2.5*sm(t,9.5,10.3);
 /* lueurs animées par-dessus */
 add(()=>{
  if(t>1&&t<9)glow(P.x,P.y,150,'rgba(120,180,255,A)',.18+.12*Math.sin(t*4)+.25*sm(t,1,2.2));
  if(t>3.2&&t<8.4)glow(Q.x,Q.y-10,200,'rgba(170,140,255,A)',.25*sm(t,3.2,4.4)*(1-sm(t,7.4,8.4)));
 });
 motes(t,1.6,6,P.x,P.y,170,'rgba(190,225,255,A)',34);
 /* jaillissement, rotation, orbite, fusion */
 if(t>5.2&&t<11.6){
  const nb=kinds.length,arr=[];
  for(let i=0;i<nb;i++){
   const ts=5.2+i*.09,dur=1.1,u=cl((t-ts)/dur),ang0=i/nb*Math.PI*2,tl=ts+dur;
   const orb=a=>({x:P.x+Math.cos(a)*118,y:P.y-70+Math.sin(a)*34,d:Math.sin(a)});
   let x,y,r,al=1,sp=16;
   if(u<=0)continue;
   if(t<tl){const e=1-Math.pow(1-u,2.2),tg=orb(ang0+(tl-5.2)*1.0),side=(R(i+11)-.5)*140;x=lerp(Q.x,tg.x,e)+Math.sin(u*Math.PI)*side;y=lerp(Q.y,tg.y,e)-Math.sin(u*Math.PI)*70;r=lerp(6,17,e)}
   else{const a=ang0+(t-5.2)*1.0,o=orb(a);x=o.x;y=o.y+Math.sin(t*3+i)*4;r=15+o.d*5;sp=9}
   if(t>9.0){const k=sm(t,9.0,9.9),a=ang0+(t-5.2)*1.0+(t-9)*2,rr=118*(1-k);x=P.x+Math.cos(a)*rr;y=lerp(P.y-70+Math.sin(a)*34*(1-k),P.y-96,k);r=lerp(r,6,k);al=1-sm(t,9.5,9.95)}
   arr.push({x,y,r,al,sp,i,u})
  }
  arr.sort((a,b)=>a.y-b.y).forEach(b=>{const tier=kinds[b.i];
   if(t<6.6&&b.u>0&&b.u<1){add(()=>{ctx.strokeStyle=`rgba(${tier===3?'255,200,255':BT[tier].aura},.5)`;ctx.lineWidth=b.r*.55;ctx.lineCap='round';ctx.beginPath();const n=8;for(let s=0;s<n;s++){const uu=Math.max(0,b.u-s*.035),e=1-Math.pow(1-uu,2.2),tl=5.2+b.i*.09+1.1,tg={x:P.x+Math.cos(b.i/kinds.length*6.283+(tl-5.2))*118,y:P.y-70+Math.sin(b.i/kinds.length*6.283+(tl-5.2))*34},side=(R(b.i+11)-.5)*140;const px=lerp(Q.x,tg.x,e)+Math.sin(uu*Math.PI)*side,py=lerp(Q.y,tg.y,e)-Math.sin(uu*Math.PI)*70;s?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.stroke()})}
   ctx.globalAlpha=b.al;aura(b.x,b.y,b.r,tier,t);ball(b.x,b.y,b.r,tier,t*b.sp*.5+b.i,t*b.sp,0);ctx.globalAlpha=1});
  if(t>=9.3&&t<11.5){const mt=maxTier(),k=sm(t,9.3,9.9),o=sm(t,10.2,11),rr=lerp(8,54,k)*(1+.08*Math.sin(t*40)*(1-o));
   aura(P.x,P.y-96,rr,mt,t);add(()=>{glow(P.x,P.y-96,120+o*200,'rgba(255,225,150,A)',.15+.45*o);if(o>0){ctx.fillStyle=`rgba(255,255,255,${o*.55})`;ctx.beginPath();ctx.arc(P.x,P.y-96,o*40,0,7);ctx.fill()}});
   if(o>.1)rays(P.x,P.y-96,t,o*.7,24,340,'rgba(255,230,170,A)');
   ctx.globalAlpha=1-sm(t,11.1,11.5);ball(P.x,P.y-96,rr,mt,Math.sin(t*28)*.12*(1-o)+t*(t<10.2?9:0),t*14,o);ctx.globalAlpha=1}
 }
 if(t>=10.6){
  const ex=sm(t,10.6,11.5),sil=sm(t,11.1,12.4);
  add(()=>{glow(P.x,P.y-96,420,'rgba(255,225,160,A)',.22*ex)});
  rays(P.x,P.y-96,t,ex*(1-.3*sm(t,12.6,13.4)),34,560,t>12?'rgba(255,240,200,A)':'rgba(255,215,160,A)');

  pulls.slice(0,N===1?1:6).forEach((p,i)=>{const c=SIL[p.id];if(!c)return;const main=i===0,a=cl(sil*1.4-(main?0:.2)),dx=main?0:(i%2?1:-1)*(62+i*22),dy=main?0:24+i*10,s=(main?230:130)*(.7+.3*sil);ctx.globalAlpha=a;ctx.drawImage(c,P.x+dx-s/2,P.y-96+dy-s*.55+(1-sil)*40,s,s);ctx.globalAlpha=1});

 }
 const pf=Math.max(0,1-Math.abs(t-4.5)/.35);if(pf>0){add(()=>{ctx.fillStyle=`rgba(255,255,255,${pf*.5})`;ctx.fillRect(-20,-20,W+40,H+40)})}
 const fl=sm(t,12.2,12.9)*(1-sm(t,13.0,END));ctx.fillStyle=`rgba(255,250,235,${fl})`;ctx.fillRect(-20,-20,W+40,H+40);
 ctx.setTransform(1,0,0,1,0,0);
 const l=LAB.filter(x=>t>=x[0]).pop();document.getElementById('lab').textContent=l[1];document.getElementById('sc').value=Math.round(t*100);
}
function showRes(){
 const r=document.getElementById('res');done=true;
 r.innerHTML=`<h2>${N===1?'Tu obtiens':'Résultat du ×10'}</h2><div class="cards ${N===1?'one':'ten'}">${pulls.map(p=>`<div class="cd ${p.rare?'r':''}"><img src="${AR}${p.id}.png" alt="">${p.n}<div class="s">${'★'.repeat(p.tier+1)}</div></div>`).join('')}</div><div class="rb"><a id="again">Rejouer</a><a id="back">Retour</a></div>`;
 r.style.display='flex';document.getElementById('again').onclick=()=>start(N);document.getElementById('back').onclick=idle;
}
function ui(on){const b=document.getElementById('bt');b.style.opacity=on?1:0;b.style.pointerEvents=on?'auto':'none';document.getElementById('hd').style.opacity=on?1:0}
function idle(){document.getElementById('res').style.display='none';done=false;paused=true;tcur=0;frame(0);ui(true)}
function start(n){N=n;newPull();document.getElementById('res').style.display='none';done=false;paused=false;document.getElementById('pz').textContent='Pause';ui(false);t0=performance.now();tcur=0}
document.querySelectorAll('.bt a').forEach(a=>a.onclick=()=>start(+a.dataset.n));
document.getElementById('rp').onclick=()=>start(N);
document.getElementById('pz').onclick=e=>{paused=!paused;e.target.textContent=paused?'Reprendre':'Pause';if(!paused)t0=performance.now()-tcur*1000};
document.getElementById('rr').onclick=e=>{rmode=rmode>=3?-1:rmode+1;e.target.textContent='Tirage : '+(rmode<0?'aléatoire':TN[rmode])}
document.getElementById('sc').oninput=e=>{if(!pulls.length)newPull();paused=true;document.getElementById('pz').textContent='Reprendre';tcur=e.target.value/100;document.getElementById('res').style.display='none';done=false;ui(false);frame(tcur)};
function loop(now){if(!paused){tcur=(now-t0)/1000;if(tcur>=END){tcur=END;frame(END);if(!done)showRes()}else frame(tcur)}else if(loaded<13||!loop.f){frame(tcur);if(loaded>=13)loop.f=1}requestAnimationFrame(loop)}
addEventListener('resize',()=>{fit();frame(tcur)});
fit();newPull();ui(true);requestAnimationFrame(loop);
</script></body></html>
