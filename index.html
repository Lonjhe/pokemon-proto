<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prototype — Explorer et Mes Pokémon</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--bg:#0b1030;--p:#151a42;--p2:#1d2358;--b:#2f3a86;--y:#ffcb05;--c:#4dd0e1;--g:#66bb6a;--r:#ef5350;--v:#9575cd;--o:#ff9800;--t:#e8ebff;--m:#98a0d6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#060919;color:var(--t);font:14px/1.4 'Nunito',system-ui,sans-serif}
.px{font-family:'Press Start 2P',monospace;line-height:1.5}
.shell{container-type:inline-size;min-height:100vh;background:var(--bg)}
.app{display:flex;flex-direction:column;min-height:100vh;max-width:1180px;margin:0 auto;border-inline:2px solid var(--b)}
.hud{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--p);border-bottom:2px solid var(--b);position:sticky;top:0;z-index:5}
.av{width:34px;height:34px;background:var(--y);border:2px solid #0b1030;display:grid;place-items:center;color:#0b1030;font-size:18px;flex:none}
.lv{font-size:10px;color:var(--y)}
.bar{height:9px;background:#080c26;border:1px solid var(--b);flex:1;min-width:40px}
.bar>i{display:block;height:100%;transition:width .5s}
.chip{display:inline-flex;align-items:center;gap:4px;background:#080c26;border:1px solid var(--b);padding:2px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.main{display:flex;flex:1;min-height:0}
.rail{width:78px;background:var(--p);border-right:2px solid var(--b);display:flex;flex-direction:column;gap:2px;padding:8px 4px;flex:none}
.rail a,.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--m);font-size:11px;font-weight:700;padding:7px 2px;border:2px solid transparent;text-decoration:none;cursor:pointer;user-select:none}
.rail a i,.tabs a i{font-size:22px}
.rail a:hover,.tabs a:hover{color:var(--t)}
.rail a.on,.tabs a.on{color:var(--y);border-color:var(--y);background:#0b1030}
.content{flex:1;min-width:0;padding:16px;display:flex;flex-direction:column;gap:12px}
.tabs{display:none;position:sticky;bottom:0;justify-content:space-around;align-items:flex-end;background:var(--p);border-top:2px solid var(--b);padding:6px 2px calc(10px + env(safe-area-inset-bottom));z-index:5}
.tabs a{flex:1;padding:5px 0}
.tabs a.go{flex:none;width:54px;height:54px;margin-top:-24px;border-radius:50%;background:var(--y);color:#0b1030;border:3px solid #0b1030;justify-content:center}
.title{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.title h3{margin:0;font-size:11px;color:var(--y)}
.panel{background:var(--p);border:2px solid var(--b);box-shadow:inset 0 0 0 2px #0b1030;padding:12px;min-width:0}
.panel h4{margin:0 0 8px;font-size:10px;color:var(--y)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:#080c26;color:var(--t);border:2px solid var(--b);padding:8px 12px;font:800 13px 'Nunito',sans-serif;cursor:pointer;white-space:nowrap;user-select:none}
.btn:hover{border-color:var(--t)}
.btn:active{transform:translateY(1px)}
.btn.y{background:var(--y);color:#0b1030;border-color:#0b1030}
.btn.g{background:var(--g);color:#08200a;border-color:#08200a}
.btn.r{background:var(--r);color:#fff;border-color:#3a0d0d}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.off{opacity:.45;pointer-events:none}
.btn i{font-size:18px}
.seg{display:flex;flex-wrap:wrap}
.seg a{padding:6px 12px;border:2px solid var(--b);margin-right:-2px;font-weight:800;font-size:12px;color:var(--m);background:#080c26;cursor:pointer;user-select:none}
.seg a.on{background:var(--y);color:#0b1030;border-color:#0b1030;position:relative}
.cols{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px;align-items:start}
.cols.eq{grid-template-columns:1fr 1fr}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.mon{background:#0b1030;border:2px solid var(--b);padding:6px;text-align:center;position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
.mon:hover{border-color:var(--m)}
.mon.sel{border-color:var(--y)}
.mon img{width:80px;height:80px;image-rendering:pixelated}
.mon b{font-size:13px}
.mon small{color:var(--m);font-size:11px}
.mon .star{position:absolute;top:4px;right:4px;color:var(--y);font-size:16px}
.mon .fav{position:absolute;top:4px;left:4px;color:var(--r);font-size:16px}
.mon.unk img{filter:brightness(0);opacity:.5}
.ty{display:inline-block;font-size:10px;font-weight:800;padding:1px 6px;margin:1px;color:#fff;text-transform:uppercase}
.stat{display:grid;grid-template-columns:44px 1fr 30px;gap:6px;align-items:center;font-size:12px;margin:3px 0}
input,select{background:#080c26;color:var(--t);border:2px solid var(--b);padding:8px 10px;font:700 13px 'Nunito',sans-serif;min-width:0}
input{flex:1;min-width:140px}
.arena{position:relative;height:clamp(250px,42cqw,340px);overflow:hidden;border:2px solid #0b1030;user-select:none}
.arena .sky{position:absolute;inset:0 0 50% 0;background:#79b8f0}
.arena .gr{position:absolute;inset:50% 0 0 0;background:#4a9a55}
.arena .gr2{position:absolute;inset:50% 0 0 0;background:repeating-linear-gradient(90deg,#00000012 0 14px,transparent 14px 28px)}
.arena.water .sky{background:#9ad0f5}.arena.water .gr{background:#2f77b8}.arena.water .gr2{background:repeating-linear-gradient(0deg,#ffffff18 0 3px,transparent 3px 14px)}
.arena .pad{position:absolute;border-radius:50%;background:#2f7a3c;height:clamp(14px,3cqw,26px)}
.arena.water .pad{background:#245f96}
.arena .bgimg{position:absolute;inset:0;background-size:cover;background-position:center bottom;image-rendering:pixelated}
.arena img.sp{position:absolute;image-rendering:pixelated;transition:transform .35s,opacity .35s}
.arena img.gone{transform:scale(0);opacity:0}
.arena img.in{animation:pop .5s}
@keyframes pop{from{transform:translateY(-30px) scale(.4);opacity:0}to{transform:none;opacity:1}}
.tag{position:absolute;background:#f4f1e4;color:#0b1030;border:3px solid #0b1030;padding:6px 10px;font-weight:800;min-width:150px}
.tag .bar{background:#cfc9b4;border-color:#0b1030;height:8px;margin-top:4px}
.ball{position:absolute;width:26px;height:26px;border-radius:50%;border:3px solid #0b1030;background:linear-gradient(#ef5350 0 46%,#0b1030 46% 54%,#f4f1e4 54%);transition:left .6s ease-out,top .6s cubic-bezier(.3,.7,.4,1);display:none;z-index:3}
.ball::after{content:'';position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:#f4f1e4;border:2px solid #0b1030}
.ball.shake{animation:shake .7s}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-30deg)}75%{transform:rotate(30deg)}}
.ball.ok{filter:drop-shadow(0 0 8px var(--y))}
.dialog{background:#f4f1e4;color:#0b1030;border:3px solid #0b1030;padding:10px 14px;font-weight:800;min-height:46px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.acts .btn{flex-direction:column;padding:10px 4px;gap:2px}
.acts .btn i{font-size:24px}
.li{display:flex;align-items:center;gap:10px;background:#0b1030;border:2px solid var(--b);padding:8px 10px}
.li.sel{border-color:var(--y);cursor:pointer}
.li.pick{cursor:pointer}
.li .grow{flex:1;min-width:0}
.ico{width:36px;height:36px;display:grid;place-items:center;background:var(--p2);border:2px solid var(--b);font-size:20px;flex:none}
.list{display:flex;flex-direction:column;gap:6px}
.scrim{display:none}
.stub{text-align:center;padding:40px 12px}
.mvg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mvb{flex-direction:column;align-items:flex-start;gap:0;text-align:left;border-width:3px;padding:8px 10px}
.mvb small{color:var(--m);font-weight:700;font-size:11px}
.li.ko{opacity:.4;pointer-events:none}
.opp{display:flex;align-items:center;gap:12px;background-size:cover;background-position:center;flex-wrap:wrap}
.opp .grow{flex:1;min-width:140px}
.aura{position:absolute;inset:0;background:radial-gradient(circle at 70% 30%,#ff1744aa,transparent 55%);animation:aura 2s infinite alternate;mix-blend-mode:screen;pointer-events:none}
@keyframes aura{from{opacity:.35}to{opacity:.9}}
.boss-hero{position:relative;min-height:320px;border:2px solid var(--b);overflow:hidden;background:#1a1040}
.stg img.tsp{width:60px;height:60px;object-fit:contain;image-rendering:pixelated}.stg.lock{opacity:.5}.stg.cur{outline:2px solid var(--y);border-radius:10px}.tpv{display:flex;gap:2px;margin-top:3px}.tpv img{width:30px;height:30px;image-rendering:pixelated}.zh{position:relative;overflow:hidden;border-radius:10px;padding:12px;min-height:60px;margin-bottom:8px;display:flex;flex-direction:column;gap:2px}.zh::after{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,#0b1030e8 30%,#0b103040)}.zh>*{z-index:2}.zh .bgimg{z-index:0!important;position:absolute;inset:0;background-size:cover;background-position:center bottom;image-rendering:pixelated}.panel.zh.lock{opacity:.5}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#4dd0e1;color:#0b1030;font:900 12px Nunito,sans-serif;cursor:pointer;vertical-align:middle;pointer-events:auto;margin-left:4px;border:2px solid #0b1030}
.infow,.svw{position:fixed;inset:0;z-index:60;background:#000c;display:flex;align-items:center;justify-content:center;padding:12px}
.infoc{background:var(--p);border:2px solid var(--b);box-shadow:inset 0 0 0 2px #0b1030;padding:14px;width:min(560px,100%);max-height:88vh;overflow:auto}
.ir{display:flex;align-items:center;gap:10px;background:#0b1030;border:2px solid var(--b);padding:6px 10px;margin-bottom:6px}.ir.cur{border-color:var(--y);box-shadow:0 0 0 2px #ffcb0555}.ir img{width:52px;height:52px;image-rendering:pixelated}
.sv{background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 38%,#151a42) 0,#151a42 38%);border:3px solid var(--tc);box-shadow:0 0 0 3px #0b1030,0 20px 60px #000a;width:min(980px,100%);max-height:94vh;overflow:auto;display:flex;flex-direction:column}
.svh{display:flex;gap:14px;align-items:center;padding:14px 16px;background:radial-gradient(circle at 12% 50%,color-mix(in srgb,var(--tc) 55%,transparent),transparent 55%)}.svh img{width:132px;height:132px;object-fit:contain;filter:drop-shadow(0 8px 12px #0009)}.svn h3{margin:6px 0;font-size:16px}
.svtabs{padding:0 16px;margin-bottom:10px}.svb{padding:0 16px 8px}.sva{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px 16px;border-top:2px solid #0b1030;align-items:center}
.svl .svr{display:grid;grid-template-columns:130px 1fr;gap:8px;padding:8px 10px;border-bottom:1px solid #2f3a86;font-size:13px}.svl .svr span{color:var(--m);font-weight:700}
.svnote{background:#0b103099;border-left:4px solid var(--tc);padding:8px 10px;margin:10px 0;font-size:12px;color:var(--t)}
.svs{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:16px;align-items:center}.radar{width:100%;max-width:300px;overflow:visible}.radar .rg{transform-origin:130px 130px;animation:rg .7s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes rg{from{transform:scale(.05);opacity:0}to{transform:scale(1);opacity:1}}
.lg{display:flex;gap:14px;justify-content:center;font-size:12px;font-weight:800;margin-top:4px}.lg i{display:inline-block;width:12px;height:12px;margin-right:5px;vertical-align:-1px}
.svt{display:grid;grid-template-columns:1.3fr .8fr .6fr .6fr;gap:6px;padding:6px 8px;border-bottom:1px solid #2f3a86;font-size:13px;align-items:center}.svt:first-child{color:var(--m);font-size:11px;font-weight:800}.svt.tot{border-bottom:0;font-weight:900}
.svm{display:grid;grid-template-columns:1fr 1fr;gap:14px}.mvl{display:flex;flex-direction:column;gap:6px}
.mvc{position:relative;display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:'t n c' 't s s';column-gap:10px;row-gap:2px;align-items:center;background:#0b1030;border:2px solid var(--b);border-left:6px solid var(--tc);padding:7px 10px;cursor:pointer}
.mvc.sel{border-color:var(--y);background:#1d2358}.mvc.off{opacity:.45;pointer-events:none}.mvc .mvt{grid-area:t;background:var(--tc);color:#fff;font-size:10px;font-weight:900;padding:3px 7px;text-shadow:1px 1px 0 #0006}.mvc b{grid-area:n}.mvc .mvs{grid-area:s;font-size:11px;color:var(--m)}.mvc .chg{grid-area:c;font-size:11px;font-weight:900;color:var(--y);text-align:right}.mvx{margin:-3px 0 2px 8px;color:var(--m)}
.svflash{margin:0 16px 10px;background:#1f6b34;border:2px solid #66bb6a;padding:8px 10px;font-weight:800;font-size:13px}
@media(max-width:700px){.svs,.svm{grid-template-columns:1fr}.svh img{width:96px;height:96px}.svw{align-items:flex-end;padding:0}.sv{max-height:92vh}.svl .svr{grid-template-columns:100px 1fr}}
.boss-hero .bgimg{position:absolute;inset:0;background-size:cover;background-position:center bottom;image-rendering:pixelated;filter:saturate(.7) brightness(.75)}
.boss-hero>img{position:absolute;right:8%;bottom:4%;width:clamp(150px,34cqw,260px);filter:drop-shadow(0 0 18px #ff1744);animation:float 2.6s ease-in-out infinite alternate}
@keyframes float{to{transform:translateY(-12px)}}
.boss-hero .info{position:absolute;left:0;right:0;top:0;padding:10px 12px;background:linear-gradient(#0b1030ee,transparent)}
.lb{display:grid;grid-template-columns:24px 1fr auto;gap:8px;font-size:13px;padding:5px 8px;background:#0b1030;border:2px solid var(--b);margin-bottom:4px}
.lb.me{border-color:var(--y);color:var(--y)}
#stage{position:absolute;inset:0}
#dim{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(0,0,12,.2),rgba(0,0,18,.78));opacity:0;transition:opacity .25s;pointer-events:none;z-index:2}
#fxc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.arena .tag{z-index:3}
.tstrip{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.tm{background:#0b1030;border:2px solid var(--b);padding:5px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px}
.tm img{width:48px;height:48px;image-rendering:pixelated}
.tm .bar{width:100%;flex:none}
.tm small{color:var(--m);font-size:11px}
.tm:hover{border-color:var(--t)}
.tm.sel{border-color:var(--y);cursor:default}
.tm.ko{opacity:.35;pointer-events:none;filter:grayscale(1)}
.tm.off{opacity:.55;pointer-events:none}
.acts.menu{grid-template-columns:repeat(2,1fr)!important}
.acts.lock{pointer-events:none;opacity:.6}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.chips span{font-size:10px;font-weight:800;background:#0b1030;color:#fff;padding:1px 6px}
@container (max-width:700px){
 .rail{display:none}.tabs{display:flex}
 .hud .name,.hud .opt{display:none}
 .content{padding:10px}
 .cols,.cols.eq{grid-template-columns:1fr}
 .cards{grid-template-columns:repeat(3,1fr)}
 .mon img{width:64px;height:64px}
 .ty{font-size:9px;padding:1px 4px}
 .tag{min-width:120px;padding:4px 8px;font-size:12px}
 .detail.open{position:fixed;left:0;right:0;bottom:0;max-height:82vh;overflow:auto;z-index:30;border-radius:16px 16px 0 0}
 .scrim.open{display:block;position:fixed;inset:0;background:#000a;z-index:29}
 .detail:not(.open){display:none}
 .app{border-inline:0}
}
@container (min-width:701px){.closebtn{display:none}}

/* ===== ACCUEIL ===== */
.hm{display:flex;flex-direction:column;gap:12px;max-width:560px;margin:0 auto;width:100%}
.hm-sc{position:relative;height:clamp(240px,40vh,330px);overflow:hidden;border:2px solid var(--b);border-radius:20px;background:#5fb3ff}
.hm-sc .bgimg{position:absolute;inset:0;background-size:cover;background-position:center bottom}
.hm-sc::after{content:"";position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(transparent,#0b1030cc)}
.hm-cl{position:absolute;background:#fff;border-radius:99px;opacity:.8;height:14px;width:40px;box-shadow:16px -6px 0 2px #fff,32px 0 0 0 #fff;animation:hmdr 40s linear infinite;top:18%;left:-80px}
.hm-cl.b{top:34%;animation-duration:60s;animation-delay:-25s;opacity:.55;width:28px}
@keyframes hmdr{to{transform:translateX(640px)}}
.hm-pk{position:absolute;left:50%;bottom:50px;height:52%;width:auto;max-width:60%;object-fit:contain;image-rendering:pixelated;transform:translateX(-50%);filter:drop-shadow(0 10px 6px #0006);cursor:pointer;z-index:2}
.hm-pk.hop{animation:hmhop .45s}
@keyframes hmhop{40%{transform:translateX(-50%) translateY(-26px) scale(1.06)}}
.hm-bub{position:absolute;left:50%;top:12%;transform:translateX(34px);background:#fff;color:#1a1f4d;border-radius:14px;padding:7px 11px;font-size:12px;font-weight:800;box-shadow:0 4px 10px #0004;z-index:3}
.hm-bub::after{content:"";position:absolute;left:14px;bottom:-7px;border:7px solid transparent;border-top-color:#fff;border-bottom:0}
.hm-nm{position:absolute;left:12px;bottom:46px;z-index:3;text-shadow:0 2px 0 #000a}.hm-nm b{font-size:11px}.hm-nm small{display:block;font-size:11px;color:#fffd;margin-top:4px}
.hm-hp{position:absolute;right:12px;bottom:46px;z-index:3;width:110px;font-size:11px;text-align:right;text-shadow:0 1px 2px #000}.hm-hp i{display:block;height:7px;border-radius:4px;background:#0008;margin-top:3px;overflow:hidden}.hm-hp i b{display:block;height:100%;background:var(--g)}
.hm-cta{position:relative;margin-top:-34px;margin-inline:10px;z-index:4;border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#ff6b3d,#ffb300);color:#2a1300;box-shadow:0 7px 0 #b24a1e,0 12px 22px #0008;cursor:pointer;overflow:hidden;transition:transform .1s;text-decoration:none}
.hm-cta:active{transform:translateY(5px);box-shadow:0 2px 0 #b24a1e}
.hm-cta::before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,#fff6 50%,transparent 60%);background-size:250% 100%;animation:hmsh 3.5s infinite}
@keyframes hmsh{from{background-position:150% 0}to{background-position:-50% 0}}
.hm-cta .ic{width:44px;height:44px;border-radius:12px;background:#2a130022;display:grid;place-items:center;font-size:26px;flex:none}
.hm-cta small{display:block;font-size:10.5px;font-weight:800;opacity:.75;text-transform:uppercase;letter-spacing:.06em}
.hm-cta b{font-size:17px;font-weight:900;line-height:1.15;display:block}.hm-cta span{font-size:12.5px;font-weight:700}
.hm-cta .go{margin-left:auto;font-size:24px}
.hm-t{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hm-tile{position:relative;border-radius:16px;height:132px;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;border:2px solid #fff2;cursor:pointer;color:#fff;transition:transform .12s}
.hm-tile:active{transform:scale(.95)}
.hm-tile .big{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:46px;filter:drop-shadow(0 3px 0 #0005)}
.hm-tile b{font-size:13px;font-weight:900;text-shadow:0 1px 0 #0006}.hm-tile small{font-size:10.5px;font-weight:700;white-space:nowrap}
.hm-tile .bd{position:absolute;top:7px;right:7px;min-width:20px;height:20px;border-radius:10px;background:var(--r);font-size:11px;font-weight:900;display:grid;place-items:center;padding:0 6px;box-shadow:0 0 0 2px #0006;animation:hmpl 1.6s infinite}
@keyframes hmpl{50%{transform:scale(1.15)}}
.hm-g{background:radial-gradient(circle at 50% 30%,#c06bff,#5b2bb8 70%)}.hm-g .big{color:#ffe27a;animation:hmwb 2.2s ease-in-out infinite}
@keyframes hmwb{25%{transform:translateX(-50%) rotate(-8deg)}75%{transform:translateX(-50%) rotate(8deg)}}
.hm-c{background:linear-gradient(160deg,#ef5350,#a02222)}

 {k:'capoeuf',g:'Capsules',t:'Capsule Œuf',d:'Apprend une capacité Œuf',p:700,ty:'item',i:'capoeuf',n:1,ic:'egg'},
 {k:'restes',g:'Objets à tenir',t:'Restes',d:'Soigne 1/16 des PV par tour',p:900,ty:'item',i:'restes',n:1,ic:'heart-plus'},
 {k:'orbe',g:'Objets à tenir',t:'Orbe Vie',d:'Dégâts +30 %',p:1200,ty:'item',i:'orbe',n:1,ic:'diamond'},
 {k:'sitrus2',g:'Objets à tenir',t:'Baie Sitrus ×2',d:'Soigne 25 % sous 50 % de PV',p:300,ty:'item',i:'sitrus',n:2,ic:'apple'},
 {k:'ceinture',g:'Objets à tenir',t:'Ceinture Force',d:'Survit à un coup fatal',p:1000,ty:'item',i:'ceinture',n:1,ic:'shield'},
 {k:'pfeu',g:'Pierres',t:'Pierre Feu',d:'Fait évoluer certains Pokémon',p:600,ty:'item',i:'pfeu',n:1,ic:'flame'},
 {k:'peau',g:'Pierres',t:'Pierre Eau',d:'Fait évoluer certains Pokémon',p:600,ty:'item',i:'peau',n:1,ic:'droplet'},
 {k:'pfoudre',g:'Pierres',t:'Pierre Foudre',d:'Fait évoluer certains Pokémon',p:600,ty:'item',i:'pfoudre',n:1,ic:'bolt'},
 {k:'plune',g:'Pierres',t:'Pierre Lune',d:'Fait évoluer certains Pokémon',p:600,ty:'item',i:'plune',n:1,ic:'moon'},
 {k:'pfeuille',g:'Pierres',t:'Pierre Feuille',d:'Fait évoluer certains Pokémon',p:600,ty:'item',i:'leaf',n:1,ic:'leaf'},
 {k:'baie3',g:'Objets',t:'Baie ×3',d:'Calme le Pokémon sauvage',p:120,ty:'item',i:'baie',n:3,ic:'apple'},
 {k:'appat2',g:'Objets',t:'Appât ×2',d:'Attire le Pokémon',p:160,ty:'item',i:'appat',n:2,ic:'bone'}];
function boutique(){
 const rod=S.rod||0,groups=[...new Set(SHOP.map(x=>x.g))];
 const row=x=>{let st='',dis=false,lbl=`<i class="ti ti-coin"></i>${fmtN(x.p)}`;
  if(x.ty==='rod'){if(rod>=x.lv){st='Possédée';dis=true}else if(rod<x.lv-1){st='Achète d\'abord la '+ROD[x.lv-1].n;dis=true}}
  if(!dis&&S.coins<x.p)dis=true;
  const ic=x.ty==='ball'?`<img src="${BI(x.b)}" width="30" height="30" style="image-rendering:pixelated" alt="">`:`<i class="ti ti-${x.ic}"></i>`;
  return `<div class="li"><div class="ico">${ic}</div><div class="grow"><b>${x.t}</b><div style="color:var(--m);font-size:12px">${st||x.d}</div></div><a class="btn sm ${dis?'off':'y'}" data-act="buy" data-v="${x.k}">${st&&x.ty==='rod'&&rod>=x.lv?'<i class="ti ti-check"></i>':lbl}</a></div>`};
 return `<div class="title"><h3 class="px">Boutique</h3><span class="chip"><i class="ti ti-coin" style="color:var(--y)"></i>${fmtN(S.coins)}</span></div>
 <div class="cols eq">${groups.map(g=>`<div class="panel"><h4 class="px">${g}</h4><div class="list">${SHOP.filter(x=>x.g===g).map(row).join('')}</div></div>`).join('')}</div>`;
}
function buy(k){
 const x=SHOP.find(q=>q.k===k);if(!x||S.coins<x.p)return;
 if(x.ty==='rod'){if((S.rod||0)!==x.lv-1)return;S.rod=x.lv}
 else if(x.ty==='egg'){breed();S.eggs.push({k:x.e,id:pickEgg(x.e)})}
 else if(x.ty==='ball')S.balls[x.b]=(S.balls[x.b]||0)+x.n;
 else{const it=itm();it[x.i]=(it[x.i]||0)+x.n}
 S.coins-=x.p;save();render(true);
}

const wt=id=>Math.round(BY[id][3]*100);
const zPool=(key,md)=>md==='peche'?ZP[key].ids.filter(i=>WATER.includes(i)):ZP[key].ids;
const zRate=(key,id,md)=>{const p=zPool(key,md||(['river','deepsea'].includes(key)?'peche':'herbe'));return p.includes(id)?wt(id)/p.reduce((a,i)=>a+wt(i),0):0};
const rarity=r=>r>=.7?['Commun','#66bb6a']:r>=.45?['Peu commun','#4dd0e1']:r>=.25?['Rare','#ff9800']:['Très rare','#ef5350'];
function wpick(ids){let t=ids.reduce((a,i)=>a+wt(i),0)*Math.random();for(const i of ids){t-=wt(i);if(t<=0)return i}return ids[0]}
function capParts(k){const s=BY[E.id],b=BALLS[k];return[['Taux de base',s[3]],[b.n,b.m],['PV adverses',1+(100-E.hp)/100*1.5],['Endormi',E.sleep?1.5:1],['Calmé / Attiré',E.bonus||1],['Niveau >25',E.lvl>25&&!E.nopen?.8:1]]}
const capRate=k=>Math.min(.95,capParts(k).reduce((a,x)=>a*x[1],1));
const pctTxt=r=>Math.round(r*100)+' %';
const capCol=r=>r>=.6?'var(--g)':r>=.3?'var(--y)':'var(--o)';
function capHTML(){
 if(!E)return '';const k=E.ball,parts=capParts(k),r=capRate(k),best=Object.keys(BALLS).sort((a,b)=>capRate(b)-capRate(a))[0];
 return `<h4 class="px">Taux de capture <small style="font-family:Nunito;color:var(--m)">${BALLS[k].n}</small></h4>
 <div style="display:flex;align-items:center;gap:10px"><b style="font-size:26px;color:${capCol(r)}">${pctTxt(r)}</b><div class="grow">${bar(r*100,capCol(r))}</div></div>
 <div class="chips" style="margin-top:6px">${parts.map(([n,v],i)=>i===0?`<span>${n} ${pctTxt(v)}</span>`:v===1?'':`<span style="background:${v>1?'#1f6b34':'#7a2a2a'}">${n} ×${String(Math.round(v*100)/100).replace('.',',')}</span>`).join('')}${r>=.95?'<span style="background:#7a5a00">plafond 95 %</span>':''}</div>
 <div style="font-size:11px;color:var(--m);margin-top:6px">Meilleure ball : <b style="color:var(--t)">${BALLS[best].n} ${pctTxt(capRate(best))}</b>. Affaiblis le Pokémon ou utilise un objet pour augmenter les chances.</div>`;
}
function capUI(){
 if(!E)return;document.querySelectorAll('#balls .li').forEach(e=>{const r=capRate(e.dataset.ball),c=e.querySelector('.cap');if(c){c.textContent=pctTxt(r);c.style.color=capCol(r)}});
 const d=$('#capd');if(d)d.innerHTML=capHTML();
}
const infoBtn=`<a class="ibtn" data-act="info" title="Infos de rencontre">i</a>`;
function closeInfo(){const o=$('#infow');if(o)o.remove()}
function openInfo(){
 closeInfo();const key=biome[mode],z=ZP[key],ids=zPool(key,mode),tot=ids.reduce((a,i)=>a+wt(i),0),cur=E&&E.id;
 const rows=ids.slice().sort((a,b)=>wt(b)-wt(a)).map(id=>{const s=BY[id],r=wt(id)/tot,[rl,rc]=rarity(s[3]),known=!!S.dex[id],got=S.dex[id]==='c';
  return `<div class="ir ${id===cur?'cur':''}"><img src="${SPS(id)}" referrerpolicy="no-referrer" alt="" style="${known?'':'filter:brightness(0) invert(.3)'}"><div class="grow"><b>${known?s[1]:'???'}</b> ${known?s[2].map(ty).join(''):''}<div style="font-size:11px;color:var(--m)">Capture : ${['poke','super','hyper'].map(k=>`${BALLS[k].n.split(' ')[0]} ${pctTxt(Math.min(.95,s[3]*BALLS[k].m))}`).join(' · ')}</div></div><div style="text-align:right;min-width:92px"><span class="chip" style="color:${rc};border-color:${rc}">${rl}</span><div style="font-weight:900;margin-top:3px">${(r*100).toFixed(1).replace('.',',')} %</div><div style="font-size:10px;color:${got?'var(--g)':'var(--m)'}">${got?'✓ capturé':known?'vu':'inconnu'}</div></div></div>`}).join('');
 const o=document.createElement('div');o.id='infow';o.className='infow';o.dataset.act='infoclose';
 o.innerHTML=`<div class="infoc" data-dex="1"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px"><h4 class="px" style="margin:0">Rencontres · ${z.name}</h4><a class="btn sm" data-act="infoclose"><i class="ti ti-x"></i></a></div>
 <div style="font-size:12px;color:var(--m);margin-bottom:8px">Niveaux ${z.lv[0]}–${z.lv[1]} · ${mode==='peche'?'Pêche':'Herbe'} · Chance shiny 1/64 (${(100/64).toFixed(1).replace('.',',')} %)</div><div class="irl">${rows}</div>
 <div style="font-size:11px;color:var(--m);margin-top:8px">Plus un Pokémon est difficile à capturer, plus il apparaît rarement. Les taux de capture ci-dessus sont ceux d'un Pokémon à PV pleins, éveillé, sans objet.</div></div>`;
 document.body.appendChild(o);
}

document.addEventListener('click',e=>{
 const t=e.target.closest('[data-b]');if(!t)return;const a=t.dataset.b,k=+t.dataset.k;
 if(a==='duel'){const o=LOBBY&&LOBBY[k];if(o)begin({mode:'duel',bg:o.bg,foe:fighter(o.id,o.lvl),title:`${o.name} · ${o.zone}`,maxTurns:99})}
 else if(a==='boss')startBoss();
 else if(a==='adv')startAdv(k);
 else if(a==='mv')useMove(k);
 else if(a==='sw')swTo(k);
 else if(a==='toggle'){if(B&&!B.busy){B.showSw=!B.showSw;render(true)}}
 else if(a==='leave'){if(B&&B.busy)return;B=null;render()}
});
setInterval(()=>{if(route==='boss'&&!B){const st=bossStat(),f=(i,v)=>{const e=$(i);if(e)e.textContent=v};f('#bt',fmtT(st.left));f('#bhp',fmtN(st.hp)+' PV');const h=$('#bh');if(h)h.style.width=st.pct+'%'}},1000);

/* --- exploration : attaquer pour affaiblir, objets --- */
const leadMon=()=>S.box.find(m=>m.team);
const actsSet=(h,menu)=>{const a=$('#acts');if(a){a.innerHTML=h;a.classList.toggle('menu',!!menu);a.classList.remove('lock')}};
const actsLock=on=>{const a=$('#acts');if(a)a.classList.toggle('lock',on)};
function wildUI(){capUI();const c=$('#wst');if(c)c.innerHTML=chipsHTML();const h=$('#wildHp');if(h){h.style.width=E.hp+'%';h.style.background=hpc(E.hp/100)}}
function weakMenu(){
 if(busy||!E||E.state!=='ready')return;const m=leadMon();if(!m){msg('Aucun Pokémon dans l\'équipe !');return}
 const f=fighter(m.id,m.lvl,{moves:movesFrom(m)});
 actsSet(f.moves.map((v,k)=>`<a class="btn mvb" data-act="wmove" data-k="${k}" style="border-color:${TC[v.t]||'#555'}"><b>${v.n}</b><small>${v.t} · Puiss. ${v.p}</small></a>`).join('')+`<a class="btn" data-act="back" style="grid-column:1/-1"><i class="ti ti-arrow-back-up"></i>Retour</a>`,true);
 msg(`Quelle attaque pour affaiblir ${BY[E.id][1]} ?`);
}
async function weakAttack(k){
 if(busy||!E||E.state!=='ready')return;const m=leadMon();if(!m)return;busy=true;actsLock(true);
 const f=fighter(m.id,m.lvl,{moves:movesFrom(m)}),mv=f.moves[k],foe=fighter(E.id,E.lvl),lead=$('#lead'),w=$('#wild'),ar=$('#arena');
 lead.src=BK(m.id);lead.style.visibility='visible';lead.style.display='block';msg(`Go ${f.name} !`);await sleep(60);await sendOut(lead);
 msg(`${f.name} utilise ${mv.n} !`);await castFx(lead,w,mv);
 const r=calc(f,foe,mv),pct=r.d/foe.max*100,was=E.hp;E.hp=Math.max(6,E.hp-pct);
 floatTxt(ctr(w,ar),'-'+Math.round(was-E.hp)+'%',r.e>1?'#ffeb3b':'#ff5252',r.e>1?19:15);wildUI();await sleep(500);
 msg(was-pct<6?`${f.name} se retient pour ne pas l'assommer !`:r.e>1?'C\'est super efficace !':r.e<1?'Ce n\'est pas très efficace...':`${foe.name} est affaibli.`);
 await sleep(900);await recall(lead);lead.style.display='none';lead.getAnimations().forEach(a=>a.cancel());
 msg(`${f.name} revient. Le moment est idéal pour lancer une ball !`);actsSet(actsHTML());busy=false;
}
function itemsMenu(){
 if(busy||!E||E.state!=='ready')return;const it=itm();
 actsSet(Object.entries(ITEMS).map(([k,v])=>`<a class="btn mvb ${it[k]>0?'':'off'}" data-act="item" data-k="${k}"><b><i class="ti ti-${v[1]}"></i> ${v[0]} ×${it[k]||0}</b><small>${v[2]}</small></a>`).join('')+`<a class="btn" data-act="back" style="grid-column:1/-1"><i class="ti ti-arrow-back-up"></i>Retour</a>`,true);
 msg('Quel objet utiliser ?');
}
async function useItem(k){
 const it=itm();if(busy||!E||E.state!=='ready'||!(it[k]>0))return;busy=true;actsLock(true);it[k]--;save();
 const ar=$('#arena'),w=$('#wild'),tr=$('#tr');fxInit();const a=ctr(tr,ar),d=ctr(w,ar),nm=BY[E.id][1];
 msg(`Tu utilises ${ITEMS[k][0]} !`);
 const col=k==='baie'?'rgba(255,80,120,.9)':k==='dodo'?'rgba(190,120,255,.9)':'rgba(255,230,120,.9)';
 await em(520,t=>{const h=arc(a,d,t,80);sp({x:h.x,y:h.y,s0:18,s1:8,life:.2,col});sp({type:'star',x:h.x,y:h.y,vr:6,s0:8,s1:0,life:.3,col:'#fff'})});
 sp({x:d.x,y:d.y,s0:30,s1:130,life:.4,col});
 if(k==='baie'){E.bonus=Math.max(E.bonus,1.3);rad(16,(x,y)=>sp({type:'star',x:d.x+x*20,y:d.y+y*10,vy:-rnd(60,180),vx:x*30,vr:rnd(-4,4),s0:rnd(7,13),s1:0,life:rnd(.8,1.4),col:pick(['#ff7ab8','#ffb3d9','#fff'])}));msg(`${nm} savoure la baie et se calme.`)}
 else if(k==='dodo'){E.sleep=true;rad(26,(x,y)=>sp({type:'blob',x:d.x+x*10,y:d.y+y*10,vx:x*rnd(40,120),vy:y*rnd(20,60)-30,drag:1,s0:rnd(14,28),s1:30,life:rnd(.8,1.4),col:'rgba(180,110,255,.35)'}));w.style.filter='brightness(.7)';for(let i=0;i<3;i++)setTimeout(()=>floatTxt({x:d.x+20+i*14,y:d.y-20-i*16},'Z','#d1b3ff',14+i*3),i*350);msg(`${nm} s'endort profondément !`)}
 else{E.nopen=true;E.bonus=Math.min(2,E.bonus*1.2);await em(700,t=>{const g=t*14;sp({x:d.x+Math.cos(g)*(70-50*t),y:d.y+Math.sin(g)*(40-28*t),s0:rnd(8,16),s1:0,life:.35,col:'rgba(255,225,110,.9)'})});msg(`${nm} est attiré par l'odeur !`)}
 wildUI();await sleep(1100);actsSet(actsHTML());busy=false;
}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');if(!t||route!=='explorer')return;const a=t.dataset.act;
 if(a==='weaken')weakMenu();else if(a==='wmove')weakAttack(+t.dataset.k);
 else if(a==='items')itemsMenu();else if(a==='item')useItem(t.dataset.k);
 else if(a==='back'){if(!busy){actsSet(actsHTML());msg(E.msg)}}
});

breed();render();
</script>
